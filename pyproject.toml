[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-central"
version = "0.1.0"
description = "Agente Central de estudio de mercado: orquesta el Agente Interno (negocio) y el Agente Externo (mercado), genera el panel y atiende al dueño por Telegram."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11,<2",
  "controlador-mercado @ git+https://github.com/iaquantic/Agente-Controlador-de-Mercado@main",
  "python-telegram-bot[job-queue]>=21.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
agente-central = "agente_central.__main__:main"

[tool.setuptools]
packages = ["agente_central"]

[tool.setuptools.package-data]
agente_central = ["plantillas/*.html"]
